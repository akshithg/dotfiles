# Caps Lock is mapped to Command+Control+Option by Karabiner and acts as Super.

config-version = 2
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[key-mapping]
preset = 'qwerty'

[mode.main.binding]

# Window management
cmd-alt-ctrl-w = 'close'
cmd-alt-ctrl-t = 'layout floating tiling'
cmd-alt-ctrl-f = 'fullscreen'
cmd-alt-ctrl-e = 'layout tiles horizontal vertical'
cmd-alt-ctrl-shift-e = 'balance-sizes'
cmd-alt-ctrl-minus = 'resize smart -50'
cmd-alt-ctrl-equal = 'resize smart +50'

# Focus windows
cmd-alt-ctrl-left = 'focus left'
cmd-alt-ctrl-down = 'focus down'
cmd-alt-ctrl-up = 'focus up'
cmd-alt-ctrl-right = 'focus right'

# Move windows
cmd-alt-ctrl-shift-left = 'move left'
cmd-alt-ctrl-shift-down = 'move down'
cmd-alt-ctrl-shift-up = 'move up'
cmd-alt-ctrl-shift-right = 'move right'

# Switch workspaces
cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'
cmd-alt-ctrl-0 = 'workspace 0'
cmd-alt-ctrl-tab = 'workspace next'
cmd-alt-ctrl-shift-tab = 'workspace prev'

# Move windows to workspaces and follow them
cmd-alt-ctrl-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-alt-ctrl-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-alt-ctrl-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-alt-ctrl-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-alt-ctrl-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-alt-ctrl-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-alt-ctrl-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-alt-ctrl-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-alt-ctrl-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
cmd-alt-ctrl-shift-0 = ['move-node-to-workspace 0', 'workspace 0']

# Monitors
cmd-alt-ctrl-comma = 'focus-monitor prev'
cmd-alt-ctrl-period = 'focus-monitor next'
cmd-alt-ctrl-shift-comma = 'move-node-to-monitor prev'
cmd-alt-ctrl-shift-period = 'move-node-to-monitor next'

# Launchers
cmd-alt-ctrl-space = 'exec-and-forget open /System/Library/CoreServices/Spotlight.app'
cmd-alt-ctrl-enter = 'exec-and-forget open -a Ghostty'

# Help
cmd-alt-ctrl-k = 'exec-and-forget open -na Ghostty.app --args -e $HOME/.config/aerospace/show-bindings.sh'

# Configuration
cmd-alt-ctrl-shift-r = 'reload-config'
