# keybinding
set -g prefix C-Space
unbind C-b
set -g base-index 1 # start window numbering at 1
set -g pane-base-index 1 # match window base-index
set -g renumber-windows on
bind C-Space send-prefix

set -g mode-keys vi
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off

# Fix Home/End key
# Reference: https://stackoverflow.com/a/55616731/13977061
bind-key -n Home send Escape "^[[H"
bind-key -n End send Escape "^[[F"

# Mouse
setw -g mouse on
setw -g monitor-activity on

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# run command on all panes
bind . setw synchronize-panes

# appearance
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'

# Catppuccin Mocha colors without a theme plugin
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g window-status-current-style 'bg=#313244,fg=#cba6f7,bold'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7'
