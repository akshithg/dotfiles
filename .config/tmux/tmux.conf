# keybinding
set -g prefix C-a
unbind C-b
set -g base-index 1 # start window numbering at 1
set -g pane-base-index 1 # match window base-index
set -g renumber-windows on
bind C-a send-prefix

set -g mode-keys vi
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off

# Fix Home/End key
# Reference: https://stackoverflow.com/a/55616731/13977061
bind-key -n Home send Escape "^[[H"
bind-key -n End send Escape "^[[F"

# Mouse
setw -g mouse on
setw -g monitor-activity on

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# run command on all panes
bind . setw synchronize-panes

# appearance
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
TMUX_FZF_LAUNCH_KEY="C-z"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m"
TMUX_FZF_ORDER="session|window|pane|command|keybinding|clipboard|process"
# pain-control binds | and - for splits (with path preservation),
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'catppuccin/tmux'
source-file -q ~/.local/state/tmux-theme.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
