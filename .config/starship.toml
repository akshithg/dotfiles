"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_metrics\
$git_commit\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$sudo\
$python\
$rust\
$nodejs\
$conda\
$character
"""

right_format = """
$docker_context
"""

scan_timeout = 100
add_newline = true
palette = 'catppuccin_mocha'
command_timeout = 500

[username]
format = '[$user]($style)'
style_root = 'red'
style_user = 'text'
show_always = false        # only in ssh

[hostname]
format = '[$ssh_symbol$hostname]($style) '
style = 'text'
ssh_only = true
ssh_symbol = '@'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'blue'
home_symbol = '~'
read_only = ' 󰌾'
read_only_style = 'red'
truncation_length = 3
truncation_symbol = '…/'

[git_branch]
format = '$symbol[$branch(:$remote_branch)]($style) '
style = "mauve"
always_show_remote = false
only_attached = false
symbol = ''

[git_metrics]
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '
added_style = 'green'
deleted_style = 'red'
disabled = false
only_nonzero_diffs = true

[git_commit]
format = '[\($hash$tag\)]($style) '
style = 'blue'
commit_hash_length = 7
only_detached = true
tag_disabled = false
tag_symbol = ' ⚑ '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '≡'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'
up_to_date = ''
style = 'blue'
format = '[$all_status $ahead_behind $stashed]($style)'

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 1000 # 1 second

[sudo]
format = '[$symbol]($style) '
style = "red"
disabled = false
symbol = '⚡️'

[python]
python_binary = 'python3'
format = '[$symbol$virtualenv]($style) '
style = 'fg:overlay0'
symbol = ''

[rust]
format = '[$symbol]($style) '
style = 'fg:overlay0'

[nodejs]
format = '[$symbol($version)]($style) '
style = 'fg:overlay0'
detect_files = ['package.json', '.node-version']
detect_folders = ['node_modules']

[docker_context]
format = '[$symbol\($context\)]($style) '
style = 'fg:overlay0'
disabled = false
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_folders = ['.devcontainer', 'docker']

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = '[❮](green)'
format = '[$symbol]($style) '

