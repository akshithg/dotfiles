# AeroSpace - Hyprland/Omarchy-style tiling for macOS
# Super key = CapsLock (mapped to cmd+ctrl+alt via Karabiner)
#   Super + key       = cmd-alt-ctrl-key
#   Super + Shift + key = cmd-alt-ctrl-shift-key

config-version = 2
start-at-login = true

after-startup-command = [
    'exec-and-forget $HOME/.local/bin/apply-theme',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[key-mapping]
preset = 'qwerty'

# Workspaces 1-5 on external monitor, 6-9 + 0 on laptop
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'
0 = 'secondary'

# Auto-assign apps to workspaces
# External monitor: 1=terminal, 2=chrome, 3=google (gmail/drive/cal), 4=editor, 5=research
# Laptop: 8=AI, 9=safari, 0=comms (slack/discord)

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.beta'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 9'

# Chrome PWA: Google Drive
[[on-window-detected]]
if.app-id = 'com.google.Chrome.beta.app.aghbiahbpaijignceidepookljebhfak'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'org.zotero.zotero'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
run = 'move-node-to-workspace 0'

[[on-window-detected]]
if.app-name-regex-substring = 'Discord'
run = 'move-node-to-workspace 0'

# Chrome PWA: Gmail
[[on-window-detected]]
if.app-id = 'com.google.Chrome.beta.app.fmgjjmmmlfnkbppncabfkddbjimcfncm'
run = 'move-node-to-workspace 3'

# Auto-float utility and communication apps
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.FaceTime'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.UserNotificationCenter'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'

# Other Apple apps default to floating
[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Maps'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '1Password'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Karabiner'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Keymapp'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'KeyCastr'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'WhatsApp'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Yubico'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Granola'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Insta360'
run = 'layout floating'

# Chrome PWA: Google Meet — floats on whatever workspace is active
[[on-window-detected]]
if.app-id = 'com.google.Chrome.beta.app.kjgfgldnnfoeklkmfkjfagphfepbbdan'
run = 'layout floating'

# Safari Web App: YouTube Music
[[on-window-detected]]
if.app-id = 'com.apple.Safari.WebApp.CF411474-2290-4422-94EE-646A08194376'
run = 'layout floating'

# Chrome PWA: Google Calendar
[[on-window-detected]]
if.app-id = 'com.google.Chrome.beta.app.kjbdgfilnfhdoflbpgamdcdgpehopbep'
run = 'move-node-to-workspace 3'

[mode.main.binding]

# ── Tiling (matches Omarchy v2 tiling-v2.conf) ──

# Close window (Super + W)
cmd-alt-ctrl-w = 'close'

# Toggle floating / tiling (Super + T)
cmd-alt-ctrl-t = 'layout floating tiling'

# Fullscreen (Super + F)
cmd-alt-ctrl-f = 'fullscreen'

# Toggle split orientation (Super + E)
cmd-alt-ctrl-e = 'layout tiles horizontal vertical'

# Balance window sizes (Super + Shift + E)
cmd-alt-ctrl-shift-e = 'balance-sizes'

# Focus windows (Super + HJKL — macOS adaptation of Omarchy arrow keys)
cmd-alt-ctrl-h = 'focus left'
cmd-alt-ctrl-j = 'focus down'
cmd-alt-ctrl-k = 'focus up'
cmd-alt-ctrl-l = 'focus right'

# Move windows (Super + Shift + HJKL)
cmd-alt-ctrl-shift-h = 'move left'
cmd-alt-ctrl-shift-j = 'move down'
cmd-alt-ctrl-shift-k = 'move up'
cmd-alt-ctrl-shift-l = 'move right'

# Resize (Super + -/=, matches Omarchy direct resize)
cmd-alt-ctrl-minus = 'resize smart -50'
cmd-alt-ctrl-equal = 'resize smart +50'

# Switch workspaces (Super + 0-9)
cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'
cmd-alt-ctrl-0 = 'workspace 0'

# Move window to workspace and follow (Super + Shift + 0-9)
cmd-alt-ctrl-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-alt-ctrl-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-alt-ctrl-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-alt-ctrl-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-alt-ctrl-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-alt-ctrl-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-alt-ctrl-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-alt-ctrl-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-alt-ctrl-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
cmd-alt-ctrl-shift-0 = ['move-node-to-workspace 0', 'workspace 0']

# Workspace navigation (Super + Tab/Shift+Tab/Ctrl+Tab, matches Omarchy v2)
cmd-alt-ctrl-tab = 'workspace next'
cmd-alt-ctrl-shift-tab = 'workspace prev'

# Focus monitors (Super + comma/period)
cmd-alt-ctrl-comma = 'focus-monitor prev'
cmd-alt-ctrl-period = 'focus-monitor next'

# Move window to monitor (Super + Shift + comma/period)
cmd-alt-ctrl-shift-comma = 'move-node-to-monitor prev'
cmd-alt-ctrl-shift-period = 'move-node-to-monitor next'

# ── App launchers (matches Omarchy bindings.conf) ──

# Terminal (Super + Enter)
cmd-alt-ctrl-enter = 'exec-and-forget open -a Ghostty'

# Browser (Super + B)
cmd-alt-ctrl-b = 'exec-and-forget open -a "Google Chrome Beta"'

# Neovim (Super + N)
cmd-alt-ctrl-n = 'exec-and-forget open -na Ghostty.app --args -e nvim'

# Lazydocker (Super + D)
cmd-alt-ctrl-d = 'exec-and-forget open -na Ghostty.app --args -e lazydocker'

# Messenger / Slack (Super + G)
cmd-alt-ctrl-g = 'exec-and-forget open -a Slack'

# Obsidian (Super + O)
cmd-alt-ctrl-o = 'exec-and-forget open -a Obsidian'

# Messages (Super + M)
cmd-alt-ctrl-m = 'exec-and-forget open -a "Messages"'

# ── Utilities (matches Omarchy utilities.conf) ──

# Show keybindings (Super + /)
cmd-alt-ctrl-slash = 'exec-and-forget open -na Ghostty.app --args -e $HOME/.config/aerospace/show-bindings.sh'

# Reload config (Super + Shift + R)
cmd-alt-ctrl-shift-r = 'reload-config'
